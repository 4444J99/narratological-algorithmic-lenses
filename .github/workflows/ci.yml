name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync Python dependencies
        run: uv sync

      - name: Run Ruff check
        run: uv run ruff check .

      - name: Run Mypy type-check
        run: uv run mypy .

      - name: Run Python test gate
        run: uv run pytest

      - name: Run API smoke tests
        run: uv run python scripts/test_api_smoke.py

      - name: Run MCP smoke tests
        run: uv run python scripts/test_mcp_smoke.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Run web tests
        run: npm run web:test

      - name: Run web linter
        run: npm run lint -w packages/web

      - name: Run web typecheck
        run: npm run typecheck -w packages/web

      - name: Build web application
        run: npm run web:build
